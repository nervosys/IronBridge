# cargo-deny configuration
# Run with: cargo deny check
# Schema: cargo-deny v2 (compatible with cargo-deny >= 0.16)

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# In schema v2, vulnerabilities are denied by default and unmaintained
# advisories are warnings unless explicitly ignored.
#
# The crates below are *unmaintained* (not vulnerable). They are pulled in
# transitively by upstream dependencies (instant by parking_lot 0.11 chain,
# paste by ratatui-style macro chains, proc-macro-error by older derive
# crates). They cannot be removed without breaking-change upgrades to those
# upstreams. Re-evaluate when upstreams release new majors.
#
# The vulnerability entries below are risk-accepted with the same rationale
# recorded in `.cargo/audit.toml`; keep the two lists in step, or `cargo deny
# check` and `cargo audit` disagree about whether this tree is clean.
ignore = [
    "RUSTSEC-2024-0384", # instant — unmaintained
    "RUSTSEC-2024-0436", # paste — unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained; pulled in by the
                         # async-graphql and actix derive chains. Replaces the
                         # ignore for RUSTSEC-2024-0370 (proc-macro-error v1),
                         # which no longer appears in the tree.

    # h2 0.3.x — HTTP/2 DoS via unbounded empty DATA frames. Not reachable: the
    # server binds plain HTTP, and HTTP/2 is only negotiated over TLS ALPN,
    # which this process never does. h2 0.3.x is pinned by the whole actix-web
    # 4.x stack; the fix is in h2 >=0.4.16, which needs hyper 1.x.
    "RUSTSEC-2026-0258",

    # rsa 0.9.x — Marvin Attack timing sidechannel. No fixed release exists
    # upstream. The attack needs an RSA decryption oracle; ironbridge-sso does
    # no RSA decryption, only signature verification and signing.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-only",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",            # used by webpki-roots
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates
deny = []

# Skip certain crates from duplicate detection
skip = []

skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
