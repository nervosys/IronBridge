[package]
name = "ironbridge-cli"
version = "2.0.1"
edition = "2021"
rust-version = "1.75"
description = "Universal chat session manager - harvest, merge, and analyze AI chat history from VS Code, Cursor, and other editors"
authors = ["Nervosys LLC <hello@nervosys.ai>"]
license = "AGPL-3.0-only OR LicenseRef-IronBridge-Commercial"
repository = "https://github.com/nervosys/IronBridge"
homepage = "https://github.com/nervosys/IronBridge"
documentation = "https://docs.rs/ironbridge-cli"
readme = "README.md"
keywords = ["chat", "ai", "copilot", "session", "history"]
categories = ["command-line-utilities", "development-tools", "database"]
exclude = ["target/", "tests/fixtures/", ".github/", "*.db", "*.log"]

[lib]
name = "ironbridge"
path = "src/lib.rs"

[features]
default = []
# SAML verification now comes from ironbridge-sso (pure Rust), so the enterprise
# feature no longer pulls xmlsec1/libxml2/OpenSSL and builds on any platform
# cargo does. It gates the audit, retention and SSO scopes, nothing else.
enterprise = []

[dependencies]
# Pure-Rust SSO. Replaces samael, which needed xmlsec1 and could not build on
# Windows; see ironbridge-sso/README.md for what it does and does not guarantee.
# `http` is on because the OIDC flow has to fetch: discovery, JWKS, and the
# token exchange. It pulls reqwest with rustls, the same backend this crate
# already uses, so it adds no new native dependency. SAML needs none of it.
ironbridge-sso = { path = "../ironbridge-sso", default-features = false, features = [
    "http",
] }

# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"

# Async runtime
tokio = { version = "1.34", features = ["full"] }

# Parallel processing
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# SQLite for VS Code state.vscdb
rusqlite = { version = "0.30", features = ["bundled"] }

# File system utilities
walkdir = "2.4"
dirs = "5.0"
glob = "0.3"
notify = { version = "7.0", default-features = false, features = [
    "macos_fsevent",
] }
notify-debouncer-mini = "0.5"

# Lazy static initialization
once_cell = "1.19"

# URL encoding/decoding
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Table formatting for CLI output
tabled = "0.20"

# Colored terminal output
colored = "3.0"
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async trait support (for ADK)
async-trait = "0.1"

# Process management (check if VS Code is running)
sysinfo = "0.37"

# TUI framework
ratatui = "0.29"
crossterm = "0.29"

# HTTP client for cloud API providers (using rustls for cross-compilation compatibility)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "cookies",
    "rustls-tls",
    "gzip",
    "brotli",
    # Uploading a training file to a provider is a multipart form; the OpenAI
    # files endpoint has no JSON equivalent.
    "multipart",
] }

# HTTP server for API (using rustls for cross-compilation compatibility)
actix-web = { version = "4", default-features = false, features = [
    "rustls-0_23",
] }
actix-http = { version = "3", features = ["ws"] }
actix-ws = "0.3"
actix-cors = "0.7"
actix-files = "0.6"

# GraphQL
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-actix-web = "7"

# Async streaming for SSE
async-stream = "0.3"
futures-util = { version = "0.3", features = ["sink"] }

# Base64 encoding for API requests
base64 = "0.21"

# Atom parsing for the arXiv proxy. Same version ironbridge-sso already uses for
# SAML, so this adds nothing new to the lock file.
roxmltree = "0.20"

# AES decryption for browser cookies
aes-gcm = "0.10"

# JWT authentication
jsonwebtoken = "9.3"

# Password hashing
# argon2id for user account passwords -- memory-hard and deliberately slow, so a
# leaked users table is not a fast GPU-cracking target the way the previous
# unsalted-construction SHA-256 was. sha2 remains for non-password digests
# (content hashes, the legacy verify-and-upgrade path).
argon2 = "0.5"
sha2 = "0.10"
md5 = "0.7"
hmac = "0.12"
pbkdf2 = "0.12"
digest = "0.10"
rand = "0.8"
regex = "1.12.2"
flate2 = "1.1.8"
tar = "0.4"
semver = "1.0.27"

# OpenTelemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = [] }
opentelemetry-otlp = { version = "0.27", features = [
    "http-proto",
    "reqwest-blocking-client",
] }

# Windows DPAPI for cookie decryption
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation",
] }

[dev-dependencies]
# For the SAML test fixtures, which sign a response before verifying it.
rsa = "0.9"
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "ironbridge"
path = "src/main.rs"

[[bin]]
name = "ironbridge-mcp"
path = "src/mcp/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Optimize for size
