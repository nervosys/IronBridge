name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Build Release Binaries
  # ==========================================================================
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: csm
            asset_name: csm-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: csm
            asset_name: csm-linux-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: csm.exe
            asset_name: csm-windows-x86_64.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: csm
            asset_name: csm-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: csm
            asset_name: csm-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        working-directory: csm-rust
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: csm-rust/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Linux x86_64
          if [ -f artifacts/csm-linux-x86_64/csm ]; then
            chmod +x artifacts/csm-linux-x86_64/csm
            tar -czvf release/csm-linux-x86_64.tar.gz -C artifacts/csm-linux-x86_64 csm
          fi
          
          # Linux aarch64
          if [ -f artifacts/csm-linux-aarch64/csm ]; then
            chmod +x artifacts/csm-linux-aarch64/csm
            tar -czvf release/csm-linux-aarch64.tar.gz -C artifacts/csm-linux-aarch64 csm
          fi
          
          # macOS x86_64
          if [ -f artifacts/csm-macos-x86_64/csm ]; then
            chmod +x artifacts/csm-macos-x86_64/csm
            tar -czvf release/csm-macos-x86_64.tar.gz -C artifacts/csm-macos-x86_64 csm
          fi
          
          # macOS aarch64
          if [ -f artifacts/csm-macos-aarch64/csm ]; then
            chmod +x artifacts/csm-macos-aarch64/csm
            tar -czvf release/csm-macos-aarch64.tar.gz -C artifacts/csm-macos-aarch64 csm
          fi
          
          # Windows
          if [ -f "artifacts/csm-windows-x86_64.exe/csm.exe" ]; then
            cp "artifacts/csm-windows-x86_64.exe/csm.exe" release/csm-windows-x86_64.exe
          fi
          
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CSM ${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          files: |
            release/*
          body: |
            ## Chat Session Manager (CSM) ${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | [csm-linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csm-linux-x86_64.tar.gz) |
            | Linux | ARM64 | [csm-linux-aarch64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csm-linux-aarch64.tar.gz) |
            | macOS | x86_64 (Intel) | [csm-macos-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csm-macos-x86_64.tar.gz) |
            | macOS | ARM64 (Apple Silicon) | [csm-macos-aarch64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csm-macos-aarch64.tar.gz) |
            | Windows | x86_64 | [csm-windows-x86_64.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csm-windows-x86_64.exe) |

            ### Installation

            #### Linux/macOS
            ```bash
            # Download and extract
            tar -xzf csm-linux-x86_64.tar.gz
            chmod +x csm
            sudo mv csm /usr/local/bin/
            ```

            #### Windows
            Download `csm-windows-x86_64.exe` and add to your PATH.

            ### Changelog

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
