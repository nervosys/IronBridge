name: JetBrains Plugin CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'jetbrains-plugin/**'
      - '.github/workflows/jetbrains-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'jetbrains-plugin/**'
      - '.github/workflows/jetbrains-ci.yml'
  workflow_dispatch:

env:
  CI: true

jobs:
  # ==========================================================================
  # The plugin targets JVM 17 (see build.gradle.kts) but builds on a 21
  # toolchain, matching what it was verified against locally. The Gradle
  # IntelliJ plugin downloads an IntelliJ IDEA CE distribution on first run,
  # so the Gradle caches are worth keeping between runs.
  # ==========================================================================
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: jetbrains-plugin
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironbridge-jetbrains-plugin
          path: jetbrains-plugin/build/distributions/*.zip
          if-no-files-found: error
