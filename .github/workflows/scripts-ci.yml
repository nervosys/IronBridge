name: Example Scripts CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'examples/**'
      - 'browser-extension/build.ps1'
      - '.github/workflows/scripts-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'examples/**'
      - 'browser-extension/build.ps1'
      - '.github/workflows/scripts-ci.yml'
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Parse every committed PowerShell file.
  #
  # This is the deterministic half: it needs no binary, no VS Code data and no
  # network, so it gives the same answer on every runner. It catches the thing
  # a rename or a bad edit actually breaks -- a file that no longer parses.
  # ==========================================================================
  parse:
    name: Parse PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1'
          if (-not $files) { throw 'No .ps1 files found -- the path filter and the repo disagree.' }
          $bad = 0
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $bad++
              Write-Host "FAIL $f"
              $errs | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok   $f"
            }
          }
          Write-Host "$($files.Count) files, $bad with parse errors"
          if ($bad) { exit 1 }

  # ==========================================================================
  # Smoke-run the example script against a real binary.
  #
  # Deliberately tolerant. examples/basic_usage.ps1 inspects the VS Code data
  # of the machine it runs on -- workspaces, chat sessions, git state -- and a
  # CI runner has none of that, so the interesting commands legitimately find
  # nothing. What this proves is narrower but still worth proving: the binary
  # builds under the name the scripts invoke, starts, and answers the
  # subcommands they use rather than erroring out on an unknown one.
  #
  # Note it does NOT stage a mock VS Code directory. The previous version of
  # this workflow did, by setting $env:APPDATA -- which has no effect, because
  # on Windows the binary resolves that location through the known-folder API
  # and ignores the environment variable.
  # ==========================================================================
  smoke:
    name: Smoke-run examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ironbridge-rust

      - name: Build the ironbridge binary
        working-directory: ironbridge-rust
        run: cargo build --release --bin ironbridge

      - name: Report version
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'ironbridge.exe' } else { 'ironbridge' }
          $bin = Join-Path 'ironbridge-rust/target/release' $exe
          if (-not (Test-Path $bin)) { throw "Binary not found at $bin" }
          & $bin --version

      - name: Run basic_usage.ps1
        shell: pwsh
        working-directory: examples
        run: |
          $exe = if ($IsWindows) { 'ironbridge.exe' } else { 'ironbridge' }
          $bin = Join-Path (Resolve-Path '../ironbridge-rust/target/release') $exe
          try {
            ./basic_usage.ps1 -IronBridgePath $bin
            Write-Host "basic_usage.ps1 completed"
          } catch {
            # Expected on a runner with no VS Code data; the parse job is the
            # part that must stay green.
            Write-Host "basic_usage.ps1 did not complete: $_"
          }
