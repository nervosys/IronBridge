name: Rust CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'chasm-rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'chasm-rust/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chasm-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chasm-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: chasm-rust
        run: cargo build --release --all-features

      - name: Run unit tests
        working-directory: chasm-rust
        run: cargo test --release --all-features -- --nocapture

      - name: Run CLI integration tests
        working-directory: chasm-rust
        run: cargo test --test cli_integration_tests --release -- --nocapture

      - name: Run browser tests
        working-directory: chasm-rust
        run: cargo test --test browser_tests --release -- --nocapture
        continue-on-error: true  # May have different browser availability

      - name: Run harvest tests
        working-directory: chasm-rust
        run: cargo test --test harvest_tests --release -- --nocapture

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: chasm-${{ matrix.os }}
          path: |
            chasm-rust/target/release/chasm
            chasm-rust/target/release/chasm.exe
          if-no-files-found: ignore

  # ==========================================================================
  # Linting and Formatting
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: chasm-rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: chasm-rust
        run: cargo clippy --all-features --all-targets -- -D warnings

  # ==========================================================================
  # Build Examples
  # ==========================================================================
  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            chasm-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('chasm-rust/Cargo.lock') }}

      - name: Build all examples
        working-directory: chasm-rust
        run: cargo build --examples

      - name: Run local_providers example
        working-directory: chasm-rust
        run: cargo run --example local_providers
        continue-on-error: true  # May fail if no VS Code data

      - name: Run cloud_providers example
        working-directory: chasm-rust
        run: cargo run --example cloud_providers

      - name: Run basic_usage example
        working-directory: chasm-rust
        run: cargo run --example basic_usage
        continue-on-error: true

      - name: Run session_operations example
        working-directory: chasm-rust
        run: cargo run --example session_operations
        continue-on-error: true

      - name: Run history_management example
        working-directory: chasm-rust
        run: cargo run --example history_management
        continue-on-error: true

      - name: Run storage_operations example
        working-directory: chasm-rust
        run: cargo run --example storage_operations
        continue-on-error: true
