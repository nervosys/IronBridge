name: Rust CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'ironbridge-rust/**'
      # Path dependency of ironbridge-rust: a change here is only compiled by
      # this workflow, so it has to trigger it.
      - 'ironbridge-sso/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ironbridge-rust/**'
      - 'ironbridge-sso/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ironbridge-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('ironbridge-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Default features only. The `enterprise` feature links libxmlsec1 for
      # SAML signature verification, which is covered by the Linux-only
      # `enterprise` job below rather than installed on all three runners.
      - name: Build
        working-directory: ironbridge-rust
        run: cargo build --release

      - name: Run unit tests
        working-directory: ironbridge-rust
        run: cargo test --release -- --nocapture

      - name: Run CLI integration tests
        working-directory: ironbridge-rust
        run: cargo test --test cli_integration_tests --release -- --nocapture

      - name: Run browser tests
        working-directory: ironbridge-rust
        run: cargo test --test browser_tests --release -- --nocapture
        continue-on-error: true  # May have different browser availability

      - name: Run harvest tests
        working-directory: ironbridge-rust
        run: cargo test --test harvest_tests --release -- --nocapture

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironbridge-${{ matrix.os }}
          path: |
            ironbridge-rust/target/release/ironbridge
            ironbridge-rust/target/release/ironbridge.exe
          if-no-files-found: ignore

  # ==========================================================================
  # Enterprise feature (Linux only)
  #
  # `enterprise` pulls in samael, which links libxmlsec1 for XML-DSig
  # verification on the SAML login path. Rather than provisioning that C
  # library on the Windows and macOS runners, the feature is built and tested
  # here and the cross-platform matrix above stays on default features.
  # ==========================================================================
  enterprise:
    name: Enterprise Feature (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # clang/libclang are required because samael generates its xmlsec
      # bindings with bindgen at build time.
      - name: Install XML security libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev libxmlsec1-dev libxmlsec1-openssl pkg-config \
            clang libclang-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ironbridge-rust/target/
          key: ${{ runner.os }}-cargo-enterprise-${{ hashFiles('ironbridge-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-enterprise-

      - name: Build
        working-directory: ironbridge-rust
        run: cargo build --all-features

      - name: Run tests
        working-directory: ironbridge-rust
        run: cargo test --all-features -- --nocapture

      - name: Run Clippy
        working-directory: ironbridge-rust
        run: cargo clippy --all-features --all-targets -- -D warnings

  # ==========================================================================
  # Linting and Formatting
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ironbridge-rust
        run: cargo fmt --all -- --check

      # Default features here; --all-features is linted in the enterprise job,
      # which has the native XML libraries installed.
      - name: Run Clippy
        working-directory: ironbridge-rust
        run: cargo clippy --all-targets -- -D warnings

  # ==========================================================================
  # Build Examples
  # ==========================================================================
  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ironbridge-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('ironbridge-rust/Cargo.lock') }}

      - name: Build all examples
        working-directory: ironbridge-rust
        run: cargo build --examples

      - name: Run local_providers example
        working-directory: ironbridge-rust
        run: cargo run --example local_providers
        continue-on-error: true  # May fail if no VS Code data

      - name: Run cloud_providers example
        working-directory: ironbridge-rust
        run: cargo run --example cloud_providers

      - name: Run basic_usage example
        working-directory: ironbridge-rust
        run: cargo run --example basic_usage
        continue-on-error: true

      - name: Run session_operations example
        working-directory: ironbridge-rust
        run: cargo run --example session_operations
        continue-on-error: true

      - name: Run history_management example
        working-directory: ironbridge-rust
        run: cargo run --example history_management
        continue-on-error: true

      - name: Run storage_operations example
        working-directory: ironbridge-rust
        run: cargo run --example storage_operations
        continue-on-error: true
