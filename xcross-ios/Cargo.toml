[package]
name = "xcross-ios"
version = "0.1.0"
edition = "2021"
description = "Cross-compile, bundle, pseudo-sign, and package iOS apps from Windows/Linux without Xcode or a Mac."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nervosys/chasm"
keywords = ["ios", "cross-compilation", "mach-o", "ipa", "codesign"]
categories = ["command-line-utilities", "development-tools::build-utils"]

# Intentionally dependency-free: the whole toolchain orchestration, the
# Info.plist emitter, and the .ipa (zip) writer are implemented against std so
# the crate builds anywhere Rust does, including the Windows hosts this exists
# to serve.
[dependencies]

[[bin]]
name = "xcross-ios"
path = "src/main.rs"

[lib]
name = "xcross_ios"
path = "src/lib.rs"
