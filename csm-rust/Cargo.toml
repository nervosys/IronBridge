[package]
name = "csm"
version = "0.2.0"
edition = "2021"
description = "Chat Session Manager - Manage and merge chat sessions across workspaces"
authors = ["Nervosys"]
license = "MIT"
repository = "https://github.com/nervosys/chat-session-manager"
keywords = ["vscode", "chat", "session", "merge", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.34", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite for VS Code state.vscdb
rusqlite = { version = "0.30", features = ["bundled"] }

# File system utilities
walkdir = "2.4"
dirs = "5.0"

# URL encoding/decoding
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Table formatting for CLI output
tabled = "0.15"

# Colored terminal output
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Process management (check if VS Code is running)
sysinfo = "0.30"

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# HTTP client for cloud API providers (using rustls for cross-compilation compatibility)
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "blocking",
    "cookies",
    "rustls-tls",
] }

# Base64 encoding for API requests
base64 = "0.21"

# AES decryption for browser cookies
aes-gcm = "0.10"

# Windows DPAPI for cookie decryption
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "csm"
path = "src/main.rs"

[[bin]]
name = "chasm"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Optimize for size
