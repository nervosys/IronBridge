[package]
name = "chasm-desktop"
version = "1.0.0"
description = "Chasm Desktop - Chat Session Manager"
authors = ["Nervosys LLC"]
license = "AGPL-3.0-only OR LicenseRef-Chasm-Commercial"
repository = "https://github.com/nervosys/chasm"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# The API server runs in-process rather than as a bundled sidecar binary, so
# the app cannot ship in a state where the UI works but its backend is missing.
# The package is `chasm-cli`; its library target is renamed `chasm`, which is
# what the `use` paths below refer to.
chasm = { path = "../chasm-rust", package = "chasm-cli" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
