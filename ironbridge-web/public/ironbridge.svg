<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Glowing edge gradient - purple to cyan -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0e7490;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#155e75;stop-opacity:1" />
    </linearGradient>
    
    <!-- Deep ironbridge gradient -->
    <linearGradient id="ironbridgeDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Outer glow -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f0f23" stroke="url(#edgeGlow)" stroke-width="2"/>
  
  <!-- The IronBridge - jagged opening -->
  <path d="M 30 20 
           L 35 35 
           L 28 45 
           L 38 55 
           L 32 65 
           L 40 80 
           L 50 85 
           L 60 80 
           L 68 65 
           L 62 55 
           L 72 45 
           L 65 35 
           L 70 20
           L 50 25
           Z" 
        fill="url(#ironbridgeDepth)" 
        stroke="url(#edgeGlow)" 
        stroke-width="2.5"
        filter="url(#glow)"/>
  
  <!-- Glowing edges of ironbridge - left side -->
  <path d="M 30 20 L 35 35 L 28 45 L 38 55 L 32 65 L 40 80" 
        fill="none" 
        stroke="#8b5cf6" 
        stroke-width="1.5"
        filter="url(#outerGlow)"
        opacity="0.8"/>
  
  <!-- Glowing edges of ironbridge - right side -->
  <path d="M 70 20 L 65 35 L 72 45 L 62 55 L 68 65 L 60 80" 
        fill="none" 
        stroke="#0e7490" 
        stroke-width="1.5"
        filter="url(#outerGlow)"
        opacity="0.8"/>
  
  <!-- Chat bubbles floating above -->
  <g filter="url(#glow)">
    <!-- Left bubble -->
    <rect x="18" y="28" width="14" height="10" rx="3" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="20" cy="40" r="2" fill="#8b5cf6" opacity="0.7"/>
    
    <!-- Right bubble -->
    <rect x="68" y="32" width="14" height="10" rx="3" fill="#0e7490" opacity="0.9"/>
    <circle cx="80" cy="44" r="2" fill="#0e7490" opacity="0.7"/>
  </g>
  
  <!-- Data streams/bridges across ironbridge -->
  <g opacity="0.6">
    <line x1="38" y1="40" x2="62" y2="42" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="40" y1="55" x2="60" y2="53" stroke="#0e7490" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="42" y1="68" x2="58" y2="70" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Particles/nodes -->
  <circle cx="45" cy="42" r="2" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="55" cy="54" r="2" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="48" cy="70" r="1.5" fill="#a78bfa" filter="url(#glow)"/>
</svg>
