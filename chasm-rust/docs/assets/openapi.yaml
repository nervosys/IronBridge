openapi: 3.0.3
info:
  title: Chasm API
  description: |
    REST API for Chasm (Chat Session Manager) - a unified platform for harvesting, 
    managing, and analyzing AI chat sessions across multiple providers and tools.

    ## Authentication

    Currently the API supports local access without authentication. Enterprise features
    include SSO/SAML authentication and API key-based access.

    ## Rate Limiting

    Rate limiting is optional and configurable per-installation.

    ## WebSocket

    Real-time updates are available via WebSocket at `ws://<host>/ws`. Note that
    `/ws` is mounted at the server root, not under the `/api` base URL below.

    ## Scope

    This document describes only endpoints the server actually routes. Paths that
    were documented but never implemented were removed in 2.0.0; see `ROADMAP.md`
    for the ones still intended.
  version: 2.0.0
  contact:
    name: Nervosys LLC
    url: https://github.com/nervosys/chasm
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  # The server mounts everything under /api. There is no /api/v1 namespace --
  # `grep -r 'scope("/api/v1"' src/` finds nothing, and every documented path
  # returned 404 under that base when probed against a running server, which
  # made every "Try it" in the Swagger UI fail.
  - url: http://localhost:8787/api
    description: Local development server
  - url: https://api.chasm.io/api
    description: Production server (when deployed)

tags:
  - name: Health
    description: System health checks
  - name: System
    description: System management operations
  - name: Workspaces
    description: Workspace management
  - name: Sessions
    description: Chat session management
  - name: Providers
    description: AI provider configuration
  - name: Agents
    description: AI agent management
  - name: Swarms
    description: Agent swarm orchestration
  - name: Chat
    description: Chat completions
  - name: Search
    description: Search operations
  - name: Statistics
    description: Usage statistics
  - name: Inbox
    description: Agent notifications, messages, permission requests and workflow runs
  - name: Settings
    description: Application settings
  - name: Sharing
    description: Local, revocable share links -- readable through this server only
  - name: MCP
    description: Model Context Protocol tool discovery and invocation
  - name: SWE
    description: Software-engineering project context -- projects, memory and rules
  - name: Auth
    description: Accounts, sessions and subscription state (mounted at the server root)
  - name: Sync
    description: Change feed and state snapshots (mounted at the server root)
  - name: Recording
    description: Live session recording and recovery (mounted at the server root)
  - name: Webhooks
    description: Outbound webhook registration and delivery history (mounted at the server root)
  - name: Audit
    description: Audit event log (enterprise build only)
  - name: Retention
    description: Data retention policies (enterprise build only)
  - name: SSO
    description: SAML single sign-on (enterprise build only)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check if the API server is running and healthy
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /system/info:
    get:
      tags: [System]
      summary: Get system information
      operationId: getSystemInfo
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SystemInfo"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkspaceList"

  /workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace by ID
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionList"
    post:
      tags: [Sessions]
      summary: Create a session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session by ID
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: Also removes the session's rows from the normalized message table.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/messages:
    post:
      tags: [Sessions]
      summary: Append a message to a session
      description: >
        An assistant message attaches to the trailing prompt rather than
        starting a new exchange, matching how sessions are read back.
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessage"
      responses:
        "201":
          description: Message appended
        "400":
          description: Empty content or unsupported role
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/checkpoints:
    get:
      tags: [Sessions]
      summary: List checkpoints for a session
      operationId: listCheckpoints
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Checkpoints, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Checkpoint"
    post:
      tags: [Sessions]
      summary: Create a checkpoint
      operationId: createCheckpoint
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckpoint"
      responses:
        "201":
          description: Checkpoint created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Checkpoint"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/commits:
    get:
      tags: [Sessions]
      summary: Git commits for the session's workspace
      description: >
        Empty when the workspace is not a git repository or git is unavailable;
        that is the honest answer, not an error.
      operationId: listSessionCommits
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Commits, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GitCommit"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers:
    get:
      tags: [Providers]
      summary: List providers
      operationId: listProviders
      responses:
        "200":
          description: List of configured providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Provider"

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      operationId: listAgents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
    post:
      tags: [Agents]
      summary: Create agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgent"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get agent by ID
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Agent"
    put:
      tags: [Agents]
      summary: Update agent
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgent"
      responses:
        "200":
          description: Agent updated
    delete:
      tags: [Agents]
      summary: Delete agent
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "204":
          description: Agent deleted

  /stats/overview:
    get:
      tags: [Statistics]
      summary: Get statistics overview
      operationId: getStatsOverview
      responses:
        "200":
          description: Statistics overview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StatsOverview"

  /stats/providers:
    get:
      tags: [Statistics]
      summary: Per-provider session and message counts
      description: >
        Token counts are reported as 0 where the store holds none, rather than
        being estimated.
      operationId: getProviderStats
      responses:
        "200":
          description: Counts keyed by provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          $ref: "#/components/schemas/ProviderStats"

  /search:
    get:
      tags: [Search]
      summary: Search sessions and messages
      description: >
        Substring matching over session titles and, where the normalized
        message table exists, message content. Not semantic search -- there is
        no embedding index behind this route.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SearchResult"

  /swarms:
    get:
      tags: [Swarms]
      summary: List swarms
      operationId: listSwarms
      responses:
        "200":
          description: Swarms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
    post:
      tags: [Swarms]
      summary: Create a swarm
      operationId: createSwarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, orchestration, agents]
              properties:
                name:
                  type: string
                description:
                  type: string
                orchestration:
                  type: string
                  enum: [sequential, parallel, hierarchical, debate]
                agents:
                  type: array
                  items:
                    type: object
                max_iterations:
                  type: integer
      responses:
        "200":
          description: Swarm created

  /swarms/{id}:
    get:
      tags: [Swarms]
      summary: Get a swarm
      operationId: getSwarm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Swarm
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Swarms]
      summary: Delete a swarm
      operationId: deleteSwarm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Swarms]
      summary: Update a swarm
      description: Omitted fields keep their stored value.
      operationId: updateSwarm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSwarm"
      responses:
        "200":
          description: Swarm updated
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{id}/test:
    post:
      tags: [Providers]
      summary: Test provider connectivity
      description: >
        Only locally hosted providers (ollama, lmstudio) expose an endpoint this
        server can reach; anything else returns 501 rather than a success that
        tested nothing.
      operationId: testProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          latency:
                            type: integer
                            description: Round-trip time in milliseconds
        "501":
          description: No connectivity test exists for this provider
        "502":
          description: Provider unreachable

  /chat/completions:
    post:
      tags: [Chat]
      summary: Proxy a completion to the configured model
      description: >
        Forwards to an OpenAI-compatible endpoint configured with
        OPENAI_API_KEY and OPENAI_BASE_URL. Returns 503 when no model is
        configured; it never substitutes a canned reply.
      operationId: chatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          description: No messages supplied
        "502":
          description: Model unreachable or returned an error
        "503":
          description: No model configured on the server

  /harvest:
    post:
      tags: [System]
      summary: Run an incremental harvest
      description: >
        Walks the filesystem for new sessions. Can take minutes; runs on a
        blocking thread.
      operationId: runHarvest
      responses:
        "200":
          description: Harvest finished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HarvestResult"

  /settings:
    get:
      tags: [Settings]
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
    put:
      tags: [Settings]
      summary: Update settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings updated

  /stats:
    get:
      tags: [Statistics]
      summary: Database statistics
      description: Identical payload to `/stats/overview`; both are served by the same handler.
      operationId: getStats
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StatsOverview"

  /sessions/search:
    get:
      tags: [Search]
      summary: Search session titles
      description: >
        Substring match over session titles. This is the endpoint the web
        client's search box uses; `/search` additionally covers message
        content.
      operationId: searchSessions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Matching sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          query:
                            type: string
                          results:
                            type: array
                            items:
                              $ref: "#/components/schemas/Session"

  /system/health:
    get:
      tags: [System]
      summary: Server and database health
      operationId: getSystemHealth
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SystemHealth"

  /system/providers/health:
    get:
      tags: [Providers]
      summary: Provider connectivity
      description: >
        Locally hosted providers are probed at their declared endpoint.
        Cloud providers report `unknown`: the server holds no credentials for
        them, so any other verdict would be a guess.
      operationId: getProviderHealth
      responses:
        "200":
          description: One row per provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProviderHealth"

  /settings/accounts:
    get:
      tags: [Settings]
      summary: List provider accounts
      operationId: listAccounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
    post:
      tags: [Settings]
      summary: Add a provider account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Account created

  /settings/accounts/{id}:
    delete:
      tags: [Settings]
      summary: Remove a provider account
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account removed

  /mcp/tools:
    get:
      tags: [MCP]
      summary: List MCP tools
      description: Tool definitions in OpenAI function-calling form, for use as chat tools.
      operationId: listMcpTools
      responses:
        "200":
          description: Tool definitions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mcp_tools:
                            type: array
                            items:
                              $ref: "#/components/schemas/McpTool"
                          # The same tools again, wrapped as OpenAI function
                          # definitions for passing straight to a chat model.
                          tools:
                            type: array
                            items:
                              type: object

  /mcp/system-prompt:
    get:
      tags: [MCP]
      summary: System prompt describing the available tools
      operationId: getMcpSystemPrompt
      responses:
        "200":
          description: Prompt text and the tool list it describes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          system_prompt:
                            type: string
                          available_tools:
                            type: array
                            items:
                              type: string

  /mcp/call:
    post:
      tags: [MCP]
      summary: Invoke one MCP tool
      operationId: callMcpTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                arguments:
                  type: object
      responses:
        "200":
          description: Tool result

  /mcp/batch:
    post:
      tags: [MCP]
      summary: Invoke several MCP tools in one request
      operationId: callMcpToolsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tool results

  /inbox/notifications:
    get:
      tags: [Inbox]
      summary: List notifications
      operationId: listNotifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /inbox/notifications/read-all:
    post:
      tags: [Inbox]
      summary: Mark every notification read
      operationId: markAllNotificationsRead
      responses:
        "200":
          description: Marked

  /inbox/notifications/{id}/dismiss:
    post:
      tags: [Inbox]
      summary: Dismiss a notification
      operationId: dismissNotification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dismissed
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox/messages:
    get:
      tags: [Inbox]
      summary: List agent messages
      operationId: listInboxMessages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /inbox/messages/{id}/read:
    post:
      tags: [Inbox]
      summary: Mark a message read
      operationId: markMessageRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox/messages/{id}/archive:
    post:
      tags: [Inbox]
      summary: Archive a message
      operationId: archiveMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox/messages/{id}/respond:
    post:
      tags: [Inbox]
      summary: Reply to an agent message
      operationId: respondToMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
      responses:
        "200":
          description: Response recorded
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox/permissions:
    get:
      tags: [Inbox]
      summary: List permission requests
      description: >
        A request whose expiry has passed reads as `expired` rather than
        `pending`; the status is derived on read, not written by a sweeper.
      operationId: listPermissions
      responses:
        "200":
          description: Permission requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /inbox/workflows:
    get:
      tags: [Inbox]
      summary: List workflow runs
      operationId: listWorkflows
      responses:
        "200":
          description: Workflow runs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object

  /swe/projects:
    get:
      tags: [SWE]
      summary: List SWE projects
      operationId: listSweProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SweProject"
    post:
      tags: [SWE]
      summary: Register a SWE project
      description: The path must exist on disk; the server rejects one that does not.
      operationId: createSweProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path]
              properties:
                name:
                  type: string
                path:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Project registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SweProject"

  /swe/projects/{id}:
    get:
      tags: [SWE]
      summary: Get a SWE project
      operationId: getSweProject
      parameters:
        - $ref: "#/components/parameters/sweProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SweProject"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [SWE]
      summary: Delete a SWE project
      operationId: deleteSweProject
      parameters:
        - $ref: "#/components/parameters/sweProjectId"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /swe/projects/{id}/open:
    post:
      tags: [SWE]
      summary: Mark a project opened
      description: Updates `lastOpened`.
      operationId: openSweProject
      parameters:
        - $ref: "#/components/parameters/sweProjectId"
      responses:
        "200":
          description: Recorded

  /swe/projects/{id}/context:
    get:
      tags: [SWE]
      summary: Assembled project context
      description: Memory and rules for the project, plus a system-prompt fragment built from them.
      operationId: getSweContext
      parameters:
        - $ref: "#/components/parameters/sweProjectId"
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SweContext"

  /swe/projects/{id}/execute:
    post:
      tags: [SWE]
      summary: Execute a tool in the project
      operationId: executeSweTool
      parameters:
        - $ref: "#/components/parameters/sweProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tool result

  /swe/projects/{project_id}/memory:
    get:
      tags: [SWE]
      summary: List project memory
      operationId: listSweMemory
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SweMemory"
    post:
      tags: [SWE]
      summary: Store a memory entry
      operationId: createSweMemory
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
                category:
                  type: string
                importance:
                  type: string
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SweMemory"

  /swe/projects/{project_id}/memory/{id}:
    get:
      tags: [SWE]
      summary: Get a memory entry
      operationId: getSweMemory
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
        - $ref: "#/components/parameters/sweEntryId"
      responses:
        "200":
          description: Memory entry
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [SWE]
      summary: Update a memory entry
      operationId: updateSweMemory
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
        - $ref: "#/components/parameters/sweEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [SWE]
      summary: Delete a memory entry
      operationId: deleteSweMemory
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
        - $ref: "#/components/parameters/sweEntryId"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /swe/projects/{project_id}/rules:
    get:
      tags: [SWE]
      summary: List project rules
      operationId: listSweRules
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SweRule"
    post:
      tags: [SWE]
      summary: Add a rule
      operationId: createSweRule
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule:
                  type: string
                description:
                  type: string
                category:
                  type: string
                priority:
                  type: integer
      responses:
        "200":
          description: Rule added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SweRule"

  /swe/projects/{project_id}/rules/{id}:
    put:
      tags: [SWE]
      summary: Update a rule
      operationId: updateSweRule
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
        - $ref: "#/components/parameters/sweEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [SWE]
      summary: Delete a rule
      operationId: deleteSweRule
      parameters:
        - $ref: "#/components/parameters/sweProjectIdAlt"
        - $ref: "#/components/parameters/sweEntryId"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox:
    get:
      tags: [Inbox]
      summary: Get the whole inbox
      description: Notifications, agent messages, permission requests and workflow runs in one response.
      operationId: getInbox
      responses:
        "200":
          description: Inbox contents

  /inbox/counts:
    get:
      tags: [Inbox]
      summary: Unread and pending counts
      description: Badge counts only; cheaper than fetching records to length-filter them.
      operationId: getInboxCounts
      responses:
        "200":
          description: Counts

  /inbox/notifications/{id}/read:
    post:
      tags: [Inbox]
      summary: Mark a notification read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
        "404":
          description: No notification with that id

  /inbox/messages/{id}/star:
    post:
      tags: [Inbox]
      summary: Toggle a message's star
      description: Toggles server-side, so concurrent viewers cannot disagree on the state.
      operationId: toggleMessageStar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
        "404":
          description: No message with that id

  /inbox/permissions/{id}/respond:
    post:
      tags: [Inbox]
      summary: Approve or deny a permission request
      description: >-
        Expiry is applied on read, so a lapsed request reports `expired` rather
        than staying approvable. Responding to one returns 409 instead of a
        misleading success, because the agent that raised it has moved on.
      operationId: respondToPermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                scope:
                  type: string
                  enum: [once, session, run, always]
                note:
                  type: string
      responses:
        "200":
          description: Recorded
        "404":
          description: No pending request with that id
        "409":
          description: The request expired before it was answered

  /stats/timeline:
    get:
      tags: [Statistics]
      summary: Sessions and messages per day
      description: >
        Days with no activity are omitted rather than zero-filled: the store
        knows nothing about a day on which nothing happened.
      operationId: getTimeline
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Activity per day, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          days:
                            type: integer
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                sessions:
                                  type: integer
                                messages:
                                  type: integer

  /sessions/merge:
    post:
      tags: [Sessions]
      summary: Merge sessions into a new one
      description: >
        Concatenates the named sessions in order. The sources are left intact
        -- a merge that consumed its inputs would make an accidental merge
        unrecoverable. Each turn records `mergedFrom`.
      operationId: mergeSessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionIds]
              properties:
                sessionIds:
                  type: array
                  items:
                    type: string
                  minItems: 2
                title:
                  type: string
      responses:
        "201":
          description: Merged session created
        "400":
          description: Fewer than two sessions named
        "404":
          description: One of the named sessions does not exist

  /sessions/{id}/fork:
    post:
      tags: [Sessions]
      summary: Copy a session
      description: >
        The copy is independent; appending to either afterwards does not
        affect the other. Records its origin in `parentSessionId`.
      operationId: forkSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Fork created
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/export:
    get:
      tags: [Sessions]
      summary: Download a session
      description: Served as an attachment. Markdown renders the transcript; json returns the stored blob.
      operationId: exportSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        "200":
          description: The session file
          content:
            application/json:
              schema:
                type: object
            text/markdown:
              schema:
                type: string
        "400":
          description: Unsupported format
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/share:
    post:
      tags: [Sharing]
      summary: Create a share link
      description: >
        Returns a token granting read access to this session **through this
        server**. Nothing is uploaded anywhere. The token is a bearer
        credential: anyone holding it can read the session until it expires or
        is revoked.
      operationId: createShare
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInHours:
                  type: integer
                  minimum: 1
                  description: Omit for a link that only revocation can close.
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ShareLinkCreated"
        "400":
          description: expiresInHours was not positive
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Sharing]
      summary: List a session's share links
      description: Includes revoked and expired links, so they can be audited.
      operationId: listShares
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Share links, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ShareLink"

  /shared/{token}:
    get:
      tags: [Sharing]
      summary: Read a shared session
      description: >
        Requires no authentication -- the token is the credential. Answers 404
        for a token that is unknown, revoked or expired alike, so a probe
        cannot tell a closed link from a guess.
      operationId: readShared
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "200":
          description: The session, read-only
        "404":
          description: Unknown, revoked or expired
    delete:
      tags: [Sharing]
      summary: Revoke a share link
      description: Revokes rather than deletes, keeping the access record.
      operationId: revokeShare
      parameters:
        - $ref: "#/components/parameters/shareToken"
      responses:
        "200":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /search/semantic:
    get:
      tags: [Search]
      summary: Rank indexed sessions by meaning
      description: >
        Cosine similarity against embedded sessions. Only searches what has
        been indexed -- `searched` reports how many vectors that was, so an
        empty index is distinguishable from no matches. Never falls back to
        substring matching; `/search` is where that lives.
      operationId: semanticSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SemanticResults"
        "400":
          description: q is missing or empty
        "502":
          description: The embedding endpoint was unreachable or errored
        "503":
          description: No embedding model configured on the server

  /search/semantic/index:
    post:
      tags: [Search]
      summary: Embed sessions for semantic search
      description: >
        Explicit because it costs money and time proportional to the store's
        size; a query never triggers one. Skips sessions already embedded for
        the current model unless `force` is set. Reports partial progress if
        the embedding endpoint fails mid-run.
      operationId: buildSemanticIndex
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 200
                  maximum: 2000
                  description: How many of the most recently updated sessions to consider.
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Indexing finished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          model:
                            type: string
                          indexed:
                            type: integer
        "502":
          description: The embedding endpoint was unreachable or errored
        "503":
          description: No embedding model configured on the server

  # ===========================================================================
  # Root-mounted scopes.
  #
  # Everything below is registered on the App, not inside the `/api` scope, so
  # it does not sit under this document's base URL. Each path therefore carries
  # a `servers` override pointing at the server root -- OpenAPI 3's way of
  # saying "this path is not under the global base".
  #
  # These scopes are also less consistent than /api: /auth and /sync wrap their
  # payloads in the usual envelope, /recording and /webhooks answer bare. That
  # is recorded as it is rather than smoothed over.
  # ===========================================================================

  /auth/register:
    servers: &rootServer
      - url: http://localhost:8787
        description: Local development server (paths below the server root)
    post:
      tags: [Auth]
      summary: Create an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:
                  type: string
                password:
                  type: string
                display_name:
                  type: string
      responses:
        "200":
          description: Account created and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request or the email is already registered

  /auth/login:
    servers: *rootServer
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid email or password

  /auth/logout:
    servers: *rootServer
    post:
      tags: [Auth]
      summary: Sign out
      operationId: logout
      responses:
        "200":
          description: Signed out

  /auth/refresh:
    servers: *rootServer
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New tokens
        "401":
          description: Refresh token invalid or expired

  /auth/profile:
    servers: *rootServer
    get:
      tags: [Auth]
      summary: Get the signed-in user
      operationId: getProfile
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
    put:
      tags: [Auth]
      summary: Update the signed-in user
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                avatar_url:
                  type: string
      responses:
        "200":
          description: Updated
        "401":
          description: Not authenticated

  /auth/password:
    servers: *rootServer
    put:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password changed
        "401":
          description: Not authenticated

  /auth/subscription:
    servers: *rootServer
    get:
      tags: [Auth]
      summary: Get subscription state
      operationId: getSubscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Subscription"
        "401":
          description: Not authenticated

  /auth/subscription/upgrade:
    servers: *rootServer
    post:
      tags: [Auth]
      summary: Change subscription tier
      operationId: upgradeSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
      responses:
        "200":
          description: Tier changed
        "401":
          description: Not authenticated

  /sync/version:
    servers: *rootServer
    get:
      tags: [Sync]
      summary: Current sync version
      operationId: getSyncVersion
      responses:
        "200":
          description: Version and event count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          version:
                            type: integer
                          eventCount:
                            type: integer

  /sync/delta:
    servers: *rootServer
    get:
      tags: [Sync]
      summary: Changes since a version
      description: >
        Note the mixed casing -- `from_version` and `to_version` are
        snake_case where the rest of the payload is not. That is what the
        server sends.
      operationId: getSyncDelta
      parameters:
        - name: since
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SyncDelta"

  /sync/snapshot:
    servers: *rootServer
    get:
      tags: [Sync]
      summary: Full state snapshot
      operationId: getSyncSnapshot
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SyncSnapshot"

  /sync/event:
    servers: *rootServer
    post:
      tags: [Sync]
      summary: Record one sync event
      operationId: postSyncEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event recorded

  /sync/batch:
    servers: *rootServer
    post:
      tags: [Sync]
      summary: Record several sync events
      operationId: postSyncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Events recorded

  /sync/subscribe:
    servers: *rootServer
    get:
      tags: [Sync]
      summary: Server-sent event stream of sync changes
      description: >
        An SSE stream, not a JSON document -- the response never completes
        while the client stays connected.
      operationId: subscribeSync
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /recording/status:
    servers: *rootServer
    get:
      tags: [Recording]
      summary: Recorder status
      description: This scope answers bare, without the `{success, data}` envelope.
      operationId: getRecordingStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /recording/sessions:
    servers: *rootServer
    get:
      tags: [Recording]
      summary: Sessions currently being recorded
      operationId: listRecordingSessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_sessions:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer

  /recording/session/{id}:
    servers: *rootServer
    get:
      tags: [Recording]
      summary: A recorded session
      operationId: getRecordingSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Recorded session
        "404":
          $ref: "#/components/responses/NotFound"

  /recording/session/{id}/recovery:
    servers: *rootServer
    get:
      tags: [Recording]
      summary: Recovery data for a session
      operationId: getRecordingRecovery
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Recovery data
        "404":
          $ref: "#/components/responses/NotFound"

  /recording/events:
    servers: *rootServer
    post:
      tags: [Recording]
      summary: Record events
      operationId: recordEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Recorded

  /recording/snapshot:
    servers: *rootServer
    post:
      tags: [Recording]
      summary: Store a recording snapshot
      operationId: storeRecordingSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Stored

  /recording/ws:
    servers: *rootServer
    get:
      tags: [Recording]
      summary: WebSocket for live recording
      description: >
        A WebSocket upgrade, not an HTTP response. A plain GET without the
        upgrade headers is rejected. Distinct from `/ws`, which carries
        general real-time updates.
      operationId: recordingWebSocket
      responses:
        "101":
          description: Switching protocols
        "400":
          description: Not a WebSocket handshake

  /webhooks:
    servers: *rootServer
    get:
      tags: [Webhooks]
      summary: List webhooks
      description: This scope answers bare, without the `{success, data}` envelope.
      operationId: listWebhooks
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Webhooks]
      summary: Register a webhook
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Registered

  /webhooks/deliveries:
    servers: *rootServer
    get:
      tags: [Webhooks]
      summary: Delivery attempts across all webhooks
      operationId: listAllDeliveries
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /webhooks/{id}:
    servers: *rootServer
    get:
      tags: [Webhooks]
      summary: Get a webhook
      operationId: getWebhook
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Webhook
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Webhooks]
      summary: Update a webhook
      operationId: updateWebhook
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{id}/test:
    servers: *rootServer
    post:
      tags: [Webhooks]
      summary: Send a test delivery
      operationId: testWebhook
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Test dispatched
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{id}/deliveries:
    servers: *rootServer
    get:
      tags: [Webhooks]
      summary: Delivery attempts for one webhook
      operationId: listWebhookDeliveries
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Deliveries
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Enterprise scopes.
  #
  # These are `#[cfg(feature = "enterprise")]`, so a default build does not
  # route them. Each is marked `x-chasm-feature: enterprise`; the spec tests
  # skip a marked path when the feature is off and probe it normally when it
  # is on, so these are verified by any enterprise build.
  #
  # Paths and methods come from the route registrations in src/api/, which are
  # unambiguous. Response bodies are deliberately NOT modelled: the enterprise
  # feature needs OpenSSL to build (samael -> openssl-sys) and could not be
  # compiled on the machine this was written on, so no response was ever
  # observed. Every other schema in this document was read off a running
  # server, and guessing these would break that. An unmodelled body says
  # "this exists, its shape is unverified"; an invented one would lie.
  # ===========================================================================

  /audit:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Audit]
      summary: Query audit events
      operationId: listAuditEvents
      responses:
        "200":
          description: Audit events. Body not modelled -- see the note above.

  /audit/{event_id}:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Audit]
      summary: Get one audit event
      operationId: getAuditEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit event. Body not modelled.
        "404":
          $ref: "#/components/responses/NotFound"

  /audit/user/{user_id}:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Audit]
      summary: Audit events for one user
      operationId: listAuditEventsForUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit events. Body not modelled.

  /audit/resource/{type}/{id}:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Audit]
      summary: Audit events for one resource
      operationId: listAuditEventsForResource
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit events. Body not modelled.

  /audit/export:
    x-chasm-feature: enterprise
    servers: *rootServer
    post:
      tags: [Audit]
      summary: Export audit events
      operationId: exportAuditEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Export produced. Body not modelled.

  /retention/policies:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Retention]
      summary: List retention policies
      operationId: listRetentionPolicies
      responses:
        "200":
          description: Policies. Body not modelled.
    post:
      tags: [Retention]
      summary: Create a retention policy
      operationId: createRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Policy created. Body not modelled.

  /retention/policies/{policy_id}:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [Retention]
      summary: Get a retention policy
      operationId: getRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/retentionPolicyId"
      responses:
        "200":
          description: Policy. Body not modelled.
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Retention]
      summary: Update a retention policy
      operationId: updateRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/retentionPolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated. Body not modelled.
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Retention]
      summary: Delete a retention policy
      operationId: deleteRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/retentionPolicyId"
      responses:
        "200":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /retention/policies/{policy_id}/execute:
    x-chasm-feature: enterprise
    servers: *rootServer
    post:
      tags: [Retention]
      summary: Run a retention policy now
      description: Deletes data the policy selects. Not reversible.
      operationId: executeRetentionPolicy
      parameters:
        - $ref: "#/components/parameters/retentionPolicyId"
      responses:
        "200":
          description: Policy executed. Body not modelled.
        "404":
          $ref: "#/components/responses/NotFound"

  /sso/metadata:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [SSO]
      summary: SAML service-provider metadata
      operationId: getSsoMetadata
      responses:
        "200":
          description: Metadata document. Body not modelled.

  /sso/initiate:
    x-chasm-feature: enterprise
    servers: *rootServer
    post:
      tags: [SSO]
      summary: Begin a SAML login
      operationId: initiateSso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Redirect details. Body not modelled.

  /sso/callback:
    x-chasm-feature: enterprise
    servers: *rootServer
    post:
      tags: [SSO]
      summary: SAML assertion consumer
      description: >
        Receives the IdP's assertion. Signature verification is implemented
        and covered by wrapping-attack tests.
      operationId: ssoCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Assertion accepted. Body not modelled.
        "401":
          description: Assertion rejected

  /sso/idps:
    x-chasm-feature: enterprise
    servers: *rootServer
    get:
      tags: [SSO]
      summary: List identity providers
      operationId: listIdps
      responses:
        "200":
          description: Identity providers. Body not modelled.
    post:
      tags: [SSO]
      summary: Register an identity provider
      operationId: createIdp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Registered. Body not modelled.

  /sso/idps/{idp_id}:
    x-chasm-feature: enterprise
    servers: *rootServer
    put:
      tags: [SSO]
      summary: Update an identity provider
      operationId: updateIdp
      parameters:
        - $ref: "#/components/parameters/idpId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated. Body not modelled.
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [SSO]
      summary: Remove an identity provider
      operationId: deleteIdp
      parameters:
        - $ref: "#/components/parameters/idpId"
      responses:
        "200":
          description: Removed.
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    workspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sweProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
    # The SWE routes are registered with two different names for the project
    # id -- `{id}` on the project itself, `{project_id}` on its memory and
    # rules. Both are reproduced here because the router matches on the
    # literal template, so a single spelling would not describe the server.
    sweProjectIdAlt:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    sweEntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    shareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    retentionPolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
    idpId:
      name: idp_id
      in: path
      required: true
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # Every endpoint except GET /health wraps its payload in this. The spec
    # used to document the payloads bare, so a generated client failed to
    # deserialize every response it got -- a worse failure than a 404, because
    # it happens after a successful request.
    ApiEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          description: The payload. Absent on failure.
        error:
          type: string
          nullable: true

    CreateSession:
      type: object
      properties:
        title:
          type: string
        provider:
          type: string
        workspaceId:
          type: string
        workspacePath:
          type: string
        model:
          type: string

    CreateMessage:
      type: object
      required: [content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          default: user
        content:
          type: string
        modelId:
          type: string

    Checkpoint:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        messageId:
          type: string
          nullable: true
        gitCommit:
          type: string
          nullable: true
        gitBranch:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        metadata:
          type: object
          nullable: true

    CreateCheckpoint:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        messageId:
          type: string
        gitCommit:
          type: string
        gitBranch:
          type: string
        metadata:
          type: object

    GitCommit:
      type: object
      properties:
        hash:
          type: string
        shortHash:
          type: string
        message:
          type: string
        author:
          type: string
        email:
          type: string
        timestamp:
          type: integer
          format: int64
        branch:
          type: string
        sessionId:
          type: string
          nullable: true
        messageId:
          type: string
          nullable: true

    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum: [session, message, workspace]
        id:
          type: string
        title:
          type: string
        snippet:
          type: string
        sessionId:
          type: string
        provider:
          type: string
        workspaceId:
          type: string
        timestamp:
          type: integer
          format: int64

    ProviderStats:
      type: object
      properties:
        sessions:
          type: integer
        messages:
          type: integer
        tokens:
          type: integer

    UpdateSwarm:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        orchestration:
          type: string
        agents:
          type: array
          items:
            type: object
        maxIterations:
          type: integer
        status:
          type: string

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          format: float
        maxTokens:
          type: integer

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        content:
          type: string
        message:
          $ref: "#/components/schemas/ChatMessage"
        finishReason:
          type: string
        usage:
          type: object
          nullable: true

    HarvestResult:
      type: object
      properties:
        success:
          type: boolean
        sessionsImported:
          type: integer
        messagesImported:
          type: integer
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
      required: [error, message]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          # Observed value is "ok". Previously documented as an enum of
          # healthy/degraded/unhealthy, none of which the server ever returns.
          example: ok
        version:
          type: string
          example: 2.0.1

    SystemInfo:
      type: object
      properties:
        version:
          type: string
        status:
          type: string
          example: healthy
        uptime:
          type: integer
          description: Seconds since the server started.
        database:
          type: object
          properties:
            path:
              type: string
            sizeBytes:
              type: integer
        features:
          type: object
          properties:
            agents:
              type: boolean
            chat:
              type: boolean
            mcp:
              type: boolean
            swarms:
              type: boolean

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
        provider:
          type: string
        session_count:
          type: integer
        last_harvested:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Field names and types are what the server actually returns: camelCase,
    # with timestamps as epoch seconds rather than RFC 3339 strings.
    Session:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        provider:
          type: string
        messageCount:
          type: integer
        workspaceId:
          type: string
          nullable: true
        workspaceName:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
          description: Epoch seconds.
        updatedAt:
          type: integer
          format: int64
          description: Epoch seconds.

    # The list endpoints all return this shape: `items`, not a named array,
    # plus `hasMore`. Previously documented with a `sessions` key that the
    # server has never sent.
    SessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # GET /sessions/{id} returns the session alongside its reconstructed
    # messages, not a bare Session. Note the mixed casing: the nested session
    # object is camelCase while these wrapper keys and the message fields are
    # snake_case. That is what the server sends.
    SessionDetail:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        tool_invocations:
          type: array
          items:
            type: object
        file_changes:
          type: array
          items:
            type: object

    Message:
      type: object
      properties:
        index:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        content_raw:
          type: string
        created_at:
          type: integer
          format: int64
          nullable: true
        request_id:
          type: string
          nullable: true
        model_id:
          type: string
          nullable: true
        variable_data:
          nullable: true

    # The auth payloads are snake_case, except Subscription, which is not.
    # Recorded as the server sends them.
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        email_verified:
          type: boolean
        subscription_tier:
          type: string
        subscription_expires_at:
          type: integer
          format: int64
          nullable: true
        features:
          type: array
          items:
            type: string
        created_at:
          type: integer
          format: int64

    AuthSession:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        user:
