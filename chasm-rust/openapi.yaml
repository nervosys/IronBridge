openapi: 3.0.3
info:
  title: Chasm API
  description: |
    REST API for Chasm (Chat Session Manager) - a unified platform for harvesting, 
    managing, and analyzing AI chat sessions across multiple providers and tools.

    ## Authentication

    Currently the API supports local access without authentication. Enterprise features
    include SSO/SAML authentication and API key-based access.

    ## Rate Limiting

    Rate limiting is optional and configurable per-installation.

    ## WebSocket

    Real-time updates are available via WebSocket at `ws://<host>/ws`. Note that
    `/ws` is mounted at the server root, not under the `/api` base URL below.

    ## Scope

    This document describes only endpoints the server actually routes. Paths that
    were documented but never implemented were removed in 2.0.0; see `ROADMAP.md`
    for the ones still intended.
  version: 2.0.0
  contact:
    name: Nervosys LLC
    url: https://github.com/nervosys/chasm
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  # The server mounts everything under /api. There is no /api/v1 namespace --
  # `grep -r 'scope("/api/v1"' src/` finds nothing, and every documented path
  # returned 404 under that base when probed against a running server, which
  # made every "Try it" in the Swagger UI fail.
  - url: http://localhost:8787/api
    description: Local development server
  - url: https://api.chasm.io/api
    description: Production server (when deployed)

tags:
  - name: Health
    description: System health checks
  - name: System
    description: System management operations
  - name: Workspaces
    description: Workspace management
  - name: Sessions
    description: Chat session management
  - name: Providers
    description: AI provider configuration
  - name: Agents
    description: AI agent management
  - name: Swarms
    description: Agent swarm orchestration
  - name: Statistics
    description: Usage statistics
  - name: Inbox
    description: Agent notifications, messages, permission requests and workflow runs
  - name: Settings
    description: Application settings

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check if the API server is running and healthy
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /system/info:
    get:
      tags: [System]
      summary: Get system information
      operationId: getSystemInfo
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"

  /workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace by ID
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session by ID
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers:
    get:
      tags: [Providers]
      summary: List providers
      operationId: listProviders
      responses:
        "200":
          description: List of configured providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      operationId: listAgents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      tags: [Agents]
      summary: Create agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgent"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get agent by ID
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    put:
      tags: [Agents]
      summary: Update agent
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgent"
      responses:
        "200":
          description: Agent updated
    delete:
      tags: [Agents]
      summary: Delete agent
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "204":
          description: Agent deleted

  /stats/overview:
    get:
      tags: [Statistics]
      summary: Get statistics overview
      operationId: getStatsOverview
      responses:
        "200":
          description: Statistics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /settings:
    get:
      tags: [Settings]
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags: [Settings]
      summary: Update settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings updated

  /inbox:
    get:
      tags: [Inbox]
      summary: Get the whole inbox
      description: Notifications, agent messages, permission requests and workflow runs in one response.
      operationId: getInbox
      responses:
        "200":
          description: Inbox contents

  /inbox/counts:
    get:
      tags: [Inbox]
      summary: Unread and pending counts
      description: Badge counts only; cheaper than fetching records to length-filter them.
      operationId: getInboxCounts
      responses:
        "200":
          description: Counts

  /inbox/notifications/{id}/read:
    post:
      tags: [Inbox]
      summary: Mark a notification read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
        "404":
          description: No notification with that id

  /inbox/messages/{id}/star:
    post:
      tags: [Inbox]
      summary: Toggle a message's star
      description: Toggles server-side, so concurrent viewers cannot disagree on the state.
      operationId: toggleMessageStar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
        "404":
          description: No message with that id

  /inbox/permissions/{id}/respond:
    post:
      tags: [Inbox]
      summary: Approve or deny a permission request
      description: >-
        Expiry is applied on read, so a lapsed request reports `expired` rather
        than staying approvable. Responding to one returns 409 instead of a
        misleading success, because the agent that raised it has moved on.
      operationId: respondToPermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                scope:
                  type: string
                  enum: [once, session, run, always]
                note:
                  type: string
      responses:
        "200":
          description: Recorded
        "404":
          description: No pending request with that id
        "409":
          description: The request expired before it was answered

components:
  parameters:
    workspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
      required: [error, message]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        uptime_seconds:
          type: integer

    SystemInfo:
      type: object
      properties:
        version:
          type: string
        database_size_bytes:
          type: integer
        session_count:
          type: integer
        workspace_count:
          type: integer
        provider_count:
          type: integer

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
        provider:
          type: string
        session_count:
          type: integer
        last_harvested:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        workspace_id:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        message_count:
          type: integer
        token_count:
          type: integer
        archived:
          type: boolean
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            [
              copilot,
              cursor,
              chatgpt,
              claude,
              ollama,
              lm-studio,
              openai,
              anthropic,
              custom,
            ]
        enabled:
          type: boolean
        base_url:
          type: string
        models:
          type: array
          items:
            type: string

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        provider_id:
          type: string
        model:
          type: string
        temperature:
          type: number
        created_at:
          type: string
          format: date-time

    CreateAgent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        provider_id:
          type: string
        model:
          type: string
        temperature:
          type: number
          default: 0.7
      required: [name, provider_id, model]

    UpdateAgent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        temperature:
          type: number

    StatsOverview:
      type: object
      properties:
        total_sessions:
          type: integer
        total_messages:
          type: integer
        total_tokens:
          type: integer
        active_providers:
          type: integer
        workspaces:
          type: integer
        sessions_today:
          type: integer
        messages_today:
          type: integer

    Settings:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        auto_harvest:
          type: boolean
        harvest_interval_minutes:
          type: integer
        sync_enabled:
          type: boolean
        sync_provider:
          type: string
          enum: [local, s3, azure, gcs, webdav]
        encryption_enabled:
          type: boolean
        telemetry_enabled:
          type: boolean
