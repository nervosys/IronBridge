openapi: 3.0.3
info:
  title: Chasm API
  description: |
    REST API for Chasm (Chat Session Manager) - a unified platform for harvesting, 
    managing, and analyzing AI chat sessions across multiple providers and tools.

    ## Authentication

    Currently the API supports local access without authentication. Enterprise features
    include SSO/SAML authentication and API key-based access.

    ## Rate Limiting

    Rate limiting is optional and configurable per-installation.

    ## WebSocket

    Real-time updates are available via WebSocket at `ws://<host>/ws`. Note that
    `/ws` is mounted at the server root, not under the `/api` base URL below.

    ## Scope

    This document describes only endpoints the server actually routes. Paths that
    were documented but never implemented were removed in 2.0.0; see `ROADMAP.md`
    for the ones still intended.
  version: 2.0.0
  contact:
    name: Nervosys LLC
    url: https://github.com/nervosys/chasm
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  # The server mounts everything under /api. There is no /api/v1 namespace --
  # `grep -r 'scope("/api/v1"' src/` finds nothing, and every documented path
  # returned 404 under that base when probed against a running server, which
  # made every "Try it" in the Swagger UI fail.
  - url: http://localhost:8787/api
    description: Local development server
  - url: https://api.chasm.io/api
    description: Production server (when deployed)

tags:
  - name: Health
    description: System health checks
  - name: System
    description: System management operations
  - name: Workspaces
    description: Workspace management
  - name: Sessions
    description: Chat session management
  - name: Providers
    description: AI provider configuration
  - name: Agents
    description: AI agent management
  - name: Swarms
    description: Agent swarm orchestration
  - name: Chat
    description: Chat completions
  - name: Search
    description: Search operations
  - name: Statistics
    description: Usage statistics
  - name: Inbox
    description: Agent notifications, messages, permission requests and workflow runs
  - name: Settings
    description: Application settings

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check if the API server is running and healthy
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /system/info:
    get:
      tags: [System]
      summary: Get system information
      operationId: getSystemInfo
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SystemInfo"

  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkspaceList"

  /workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace by ID
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionList"
    post:
      tags: [Sessions]
      summary: Create a session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session by ID
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: Also removes the session's rows from the normalized message table.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/messages:
    post:
      tags: [Sessions]
      summary: Append a message to a session
      description: >
        An assistant message attaches to the trailing prompt rather than
        starting a new exchange, matching how sessions are read back.
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessage"
      responses:
        "201":
          description: Message appended
        "400":
          description: Empty content or unsupported role
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/checkpoints:
    get:
      tags: [Sessions]
      summary: List checkpoints for a session
      operationId: listCheckpoints
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Checkpoints, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Checkpoint"
    post:
      tags: [Sessions]
      summary: Create a checkpoint
      operationId: createCheckpoint
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckpoint"
      responses:
        "201":
          description: Checkpoint created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Checkpoint"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/commits:
    get:
      tags: [Sessions]
      summary: Git commits for the session's workspace
      description: >
        Empty when the workspace is not a git repository or git is unavailable;
        that is the honest answer, not an error.
      operationId: listSessionCommits
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Commits, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GitCommit"
        "404":
          $ref: "#/components/responses/NotFound"

  /providers:
    get:
      tags: [Providers]
      summary: List providers
      operationId: listProviders
      responses:
        "200":
          description: List of configured providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Provider"

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      operationId: listAgents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
    post:
      tags: [Agents]
      summary: Create agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgent"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get agent by ID
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Agent"
    put:
      tags: [Agents]
      summary: Update agent
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgent"
      responses:
        "200":
          description: Agent updated
    delete:
      tags: [Agents]
      summary: Delete agent
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "204":
          description: Agent deleted

  /stats/overview:
    get:
      tags: [Statistics]
      summary: Get statistics overview
      operationId: getStatsOverview
      responses:
        "200":
          description: Statistics overview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StatsOverview"

  /stats/providers:
    get:
      tags: [Statistics]
      summary: Per-provider session and message counts
      description: >
        Token counts are reported as 0 where the store holds none, rather than
        being estimated.
      operationId: getProviderStats
      responses:
        "200":
          description: Counts keyed by provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          $ref: "#/components/schemas/ProviderStats"

  /search:
    get:
      tags: [Search]
      summary: Search sessions and messages
      description: >
        Substring matching over session titles and, where the normalized
        message table exists, message content. Not semantic search -- there is
        no embedding index behind this route.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SearchResult"

  /swarms/{id}:
    put:
      tags: [Swarms]
      summary: Update a swarm
      description: Omitted fields keep their stored value.
      operationId: updateSwarm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSwarm"
      responses:
        "200":
          description: Swarm updated
        "404":
          $ref: "#/components/responses/NotFound"

  /providers/{id}/test:
    post:
      tags: [Providers]
      summary: Test provider connectivity
      description: >
        Only locally hosted providers (ollama, lmstudio) expose an endpoint this
        server can reach; anything else returns 501 rather than a success that
        tested nothing.
      operationId: testProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                          latency:
                            type: integer
                            description: Round-trip time in milliseconds
        "501":
          description: No connectivity test exists for this provider
        "502":
          description: Provider unreachable

  /chat/completions:
    post:
      tags: [Chat]
      summary: Proxy a completion to the configured model
      description: >
        Forwards to an OpenAI-compatible endpoint configured with
        OPENAI_API_KEY and OPENAI_BASE_URL. Returns 503 when no model is
        configured; it never substitutes a canned reply.
      operationId: chatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          description: No messages supplied
        "502":
          description: Model unreachable or returned an error
        "503":
          description: No model configured on the server

  /harvest:
    post:
      tags: [System]
      summary: Run an incremental harvest
      description: >
        Walks the filesystem for new sessions. Can take minutes; runs on a
        blocking thread.
      operationId: runHarvest
      responses:
        "200":
          description: Harvest finished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HarvestResult"

  /settings:
    get:
      tags: [Settings]
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Settings"
    put:
      tags: [Settings]
      summary: Update settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings updated

  /inbox:
    get:
      tags: [Inbox]
      summary: Get the whole inbox
      description: Notifications, agent messages, permission requests and workflow runs in one response.
      operationId: getInbox
      responses:
        "200":
          description: Inbox contents

  /inbox/counts:
    get:
      tags: [Inbox]
      summary: Unread and pending counts
      description: Badge counts only; cheaper than fetching records to length-filter them.
      operationId: getInboxCounts
      responses:
        "200":
          description: Counts

  /inbox/notifications/{id}/read:
    post:
      tags: [Inbox]
      summary: Mark a notification read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
        "404":
          description: No notification with that id

  /inbox/messages/{id}/star:
    post:
      tags: [Inbox]
      summary: Toggle a message's star
      description: Toggles server-side, so concurrent viewers cannot disagree on the state.
      operationId: toggleMessageStar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
        "404":
          description: No message with that id

  /inbox/permissions/{id}/respond:
    post:
      tags: [Inbox]
      summary: Approve or deny a permission request
      description: >-
        Expiry is applied on read, so a lapsed request reports `expired` rather
        than staying approvable. Responding to one returns 409 instead of a
        misleading success, because the agent that raised it has moved on.
      operationId: respondToPermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                scope:
                  type: string
                  enum: [once, session, run, always]
                note:
                  type: string
      responses:
        "200":
          description: Recorded
        "404":
          description: No pending request with that id
        "409":
          description: The request expired before it was answered

components:
  parameters:
    workspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # Every endpoint except GET /health wraps its payload in this. The spec
    # used to document the payloads bare, so a generated client failed to
    # deserialize every response it got -- a worse failure than a 404, because
    # it happens after a successful request.
    ApiEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          description: The payload. Absent on failure.
        error:
          type: string
          nullable: true

    CreateSession:
      type: object
      properties:
        title:
          type: string
        provider:
          type: string
        workspaceId:
          type: string
        workspacePath:
          type: string
        model:
          type: string

    CreateMessage:
      type: object
      required: [content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          default: user
        content:
          type: string
        modelId:
          type: string

    Checkpoint:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        messageId:
          type: string
          nullable: true
        gitCommit:
          type: string
          nullable: true
        gitBranch:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        metadata:
          type: object
          nullable: true

    CreateCheckpoint:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        messageId:
          type: string
        gitCommit:
          type: string
        gitBranch:
          type: string
        metadata:
          type: object

    GitCommit:
      type: object
      properties:
        hash:
          type: string
        shortHash:
          type: string
        message:
          type: string
        author:
          type: string
        email:
          type: string
        timestamp:
          type: integer
          format: int64
        branch:
          type: string
        sessionId:
          type: string
          nullable: true
        messageId:
          type: string
          nullable: true

    SearchResult:
      type: object
      properties:
        type:
          type: string
          enum: [session, message, workspace]
        id:
          type: string
        title:
          type: string
        snippet:
          type: string
        sessionId:
          type: string
        provider:
          type: string
        workspaceId:
          type: string
        timestamp:
          type: integer
          format: int64

    ProviderStats:
      type: object
      properties:
        sessions:
          type: integer
        messages:
          type: integer
        tokens:
          type: integer

    UpdateSwarm:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        orchestration:
          type: string
        agents:
          type: array
          items:
            type: object
        maxIterations:
          type: integer
        status:
          type: string

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          format: float
        maxTokens:
          type: integer

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        content:
          type: string
        message:
          $ref: "#/components/schemas/ChatMessage"
        finishReason:
          type: string
        usage:
          type: object
          nullable: true

    HarvestResult:
      type: object
      properties:
        success:
          type: boolean
        sessionsImported:
          type: integer
        messagesImported:
          type: integer
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
      required: [error, message]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          # Observed value is "ok". Previously documented as an enum of
          # healthy/degraded/unhealthy, none of which the server ever returns.
          example: ok
        version:
          type: string
          example: 2.0.1

    SystemInfo:
      type: object
      properties:
        version:
          type: string
        status:
          type: string
          example: healthy
        uptime:
          type: integer
          description: Seconds since the server started.
        database:
          type: object
          properties:
            path:
              type: string
            sizeBytes:
              type: integer
        features:
          type: object
          properties:
            agents:
              type: boolean
            chat:
              type: boolean
            mcp:
              type: boolean
            swarms:
              type: boolean

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
        provider:
          type: string
        session_count:
          type: integer
        last_harvested:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Field names and types are what the server actually returns: camelCase,
    # with timestamps as epoch seconds rather than RFC 3339 strings.
    Session:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        provider:
          type: string
        messageCount:
          type: integer
        workspaceId:
          type: string
          nullable: true
        workspaceName:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
          description: Epoch seconds.
        updatedAt:
          type: integer
          format: int64
          description: Epoch seconds.

    # The list endpoints all return this shape: `items`, not a named array,
    # plus `hasMore`. Previously documented with a `sessions` key that the
    # server has never sent.
    SessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # GET /sessions/{id} returns the session alongside its reconstructed
    # messages, not a bare Session. Note the mixed casing: the nested session
    # object is camelCase while these wrapper keys and the message fields are
    # snake_case. That is what the server sends.
    SessionDetail:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        tool_invocations:
          type: array
          items:
            type: object
        file_changes:
          type: array
          items:
            type: object

    Message:
      type: object
      properties:
        index:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        content_raw:
          type: string
        created_at:
          type: integer
          format: int64
          nullable: true
        request_id:
          type: string
          nullable: true
        model_id:
          type: string
          nullable: true
        variable_data:
          nullable: true

    WorkspaceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            [
              copilot,
              cursor,
              chatgpt,
              claude,
              ollama,
              lm-studio,
              openai,
              anthropic,
              custom,
            ]
        enabled:
          type: boolean
        base_url:
          type: string
        models:
          type: array
          items:
            type: string

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        provider_id:
          type: string
        model:
          type: string
        temperature:
          type: number
        created_at:
          type: string
          format: date-time

    CreateAgent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        provider_id:
          type: string
        model:
          type: string
        temperature:
          type: number
          default: 0.7
      required: [name, provider_id, model]

    UpdateAgent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        temperature:
          type: number

    StatsOverview:
      type: object
      properties:
        totalSessions:
          type: integer
        totalMessages:
          type: integer
        totalWorkspaces:
          type: integer
        totalToolInvocations:
          type: integer
        totalFileChanges:
          type: integer
        tablesEnhanced:
          type: boolean
          description: Whether the enhanced harvest tables are present.
        sessionsByProvider:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              count:
                type: integer

    Settings:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        autoSync:
          type: boolean
        syncInterval:
          type: integer
          description: Milliseconds between syncs.
        defaultProvider:
          type: string
        enableNotifications:
          type: boolean
        compactMode:
          type: boolean
        maxHistoryDays:
          type: integer
